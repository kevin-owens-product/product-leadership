# =============================================================================
# Supabase Local Development Configuration
# Podcast App V2
# =============================================================================

[project]
id = "podcast-app-v2"

# =============================================================================
# API
# =============================================================================
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# =============================================================================
# Database
# =============================================================================
[db]
port = 54322
shadow_port = 54320
major_version = 15

# =============================================================================
# Studio (Dashboard)
# =============================================================================
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# =============================================================================
# Inbucket (Email Testing)
# =============================================================================
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

# =============================================================================
# Storage
# =============================================================================
[storage]
enabled = true
file_size_limit = "100MiB"

# =============================================================================
# Auth
# =============================================================================
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = ""
secret = ""
redirect_uri = ""
url = ""

# =============================================================================
# Edge Functions
# =============================================================================
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# =============================================================================
# Analytics
# =============================================================================
[analytics]
enabled = false
port = 54327
backend = "postgres"
