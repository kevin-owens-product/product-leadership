<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Direction C — Editorial Mono — Now Playing</title>
<style>
/* ============================================================
   DIRECTION C — EDITORIAL MONO
   Near-mono surfaces, ONE cold accent, oversized display type,
   hairline dividers, brutal restraint. Tokens forked from
   styles/base.css and re-themed cold (hue 225).
   ============================================================ */
:root {
    /* Neutral ramp — cooled toward hue 225, chroma near zero. */
    --neutral-0: oklch(0.135 0.005 225);
    --neutral-1: oklch(0.155 0.005 225);   /* page background */
    --neutral-2: oklch(0.195 0.006 225);
    --neutral-3: oklch(0.245 0.007 225);
    --neutral-6: oklch(0.50 0.008 225);    /* tertiary text */
    --neutral-7: oklch(0.68 0.008 225);    /* secondary text */
    --neutral-9: oklch(0.975 0.002 225);   /* primary text */

    /* THE accent. One cold ice-blue. Used for: play, progress
       position, live/active state. Nothing else. */
    --accent: oklch(0.80 0.105 220);
    --accent-dim: oklch(0.72 0.095 220);
    --on-accent: oklch(0.15 0.02 225);

    --surface-0: var(--neutral-1);
    --text-primary: var(--neutral-9);
    --text-secondary: var(--neutral-7);
    --text-tertiary: var(--neutral-6);

    /* Hairlines — the only divider language in this direction. */
    --hairline: oklch(1 0 0 / 0.10);
    --hairline-strong: oklch(1 0 0 / 0.16);

    /* Type — oversized display spine. */
    --fs-overline: 0.6875rem;  /* 11px tracked caps */
    --fs-small: 0.8125rem;
    --fs-body: 1rem;
    --fs-display: 2.0625rem;   /* 33px episode title — oversized */
    --tracking-caps: 0.14em;

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;

    --radius-art: 4px;   /* sharp, editorial */

    --dur-1: 120ms; --dur-2: 200ms;
    --ease-out: cubic-bezier(0.2, 0, 0, 1);

    --safe-top: env(safe-area-inset-top, 12px);
    --safe-bottom: env(safe-area-inset-bottom, 12px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-width: 430px;      /* phone comp: degrade gracefully on desktop */
    margin: 0 auto;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.overline {
    font-size: var(--fs-overline);
    font-weight: 600;
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-tertiary);
}

/* ---- Top bar ---- */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-5);
}
.topbar .overline { color: var(--text-secondary); }
.icon-btn {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    color: var(--text-secondary);
    transition: opacity var(--dur-1) var(--ease-out);
}
.icon-btn:active { opacity: 0.5; }
.icon-btn svg { display: block; }

/* ---- Hero artwork: flat, sharp, hairline-framed. No glow,
   no shadow theater — austerity. ---- */
.hero {
    padding: var(--space-2) var(--space-6) 0;
}
.artwork {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--radius-art);
    border: 1px solid var(--hairline);
    overflow: hidden;
    background: var(--neutral-2);
}
.artwork svg { display: block; width: 100%; height: 100%; }

/* ---- Title block: the typographic moment ---- */
.title-block {
    padding: var(--space-6) var(--space-6) var(--space-5);
}
.title-block .show { display: block; margin-bottom: var(--space-2); }
.title-block h1 {
    font-size: var(--fs-display);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.026em;
    text-wrap: balance;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.title-block .chapter {
    margin-top: var(--space-3);
    font-size: var(--fs-small);
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.title-block .chapter .live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: 1px;
}

/* ---- Scrubber: hairline track, accent position ---- */
.scrubber { padding: var(--space-2) var(--space-6) 0; }
.track {
    position: relative;
    height: 28px;              /* generous touch target */
    display: flex;
    align-items: center;
    cursor: pointer;
}
.track .rail {
    position: absolute; left: 0; right: 0;
    height: 2px;
    background: var(--hairline-strong);
}
.track .buffered {
    position: absolute; left: 0;
    width: 62%;
    height: 2px;
    background: oklch(1 0 0 / 0.22);
}
.track .fill {
    position: absolute; left: 0;
    width: 39.6%;
    height: 2px;
    background: var(--accent);
}
.track .tick {
    position: absolute;
    width: 1px; height: 8px;
    background: oklch(1 0 0 / 0.35);
    top: 50%; transform: translateY(-50%);
}
.track .thumb {
    position: absolute;
    left: 39.6%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-primary);
    transform: translateX(-50%);
    transition: transform var(--dur-1) var(--ease-out);
}
.track:active .thumb { transform: translateX(-50%) scale(1.5); }
@media (prefers-reduced-motion: reduce) {
    .track .thumb, .icon-btn, .play-btn, .skip-btn { transition: none !important; }
}
.times {
    display: flex;
    justify-content: space-between;
    font-size: var(--fs-overline);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    margin-top: 2px;
}
.times .elapsed { color: var(--accent); }
.times .remaining { color: var(--text-tertiary); }

/* ---- Transport: one accent moment ---- */
.transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    padding: var(--space-6) var(--space-6) var(--space-8);
}
.skip-btn {
    width: 56px; height: 56px;
    display: grid; place-items: center;
    color: var(--text-primary);
    transition: transform var(--dur-1) var(--ease-out), opacity var(--dur-1);
}
.skip-btn:active { transform: scale(0.94); opacity: 0.7; }
.play-btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    display: grid; place-items: center;
    transition: transform var(--dur-1) var(--ease-out);
}
.play-btn:active { transform: scale(0.95); }
.play-btn svg { margin-left: 3px; } /* optical nudge for the triangle */

/* ---- Secondary controls: quiet row above a hairline ---- */
.secondary {
    margin-top: auto;
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-3) var(--space-8);
}
.secondary button {
    width: 48px; height: 44px;
    display: grid; place-items: center;
    color: var(--text-tertiary);
    transition: opacity var(--dur-1);
}
.secondary button:active { opacity: 0.5; }
.secondary .speed {
    font-size: var(--fs-small);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
}
.secondary .is-active { color: var(--accent); }
</style>
</head>
<body>

<header class="topbar">
    <button class="icon-btn" aria-label="Collapse player">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 10 13.5 16 7.5"/></svg>
    </button>
    <span class="overline">Now Playing</span>
    <button class="icon-btn" aria-label="More options">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/></svg>
    </button>
</header>

<div class="hero">
    <div class="artwork" data-art="rings" aria-hidden="true"></div>
</div>

<div class="title-block">
    <span class="overline show">Episode 5 of 6 · 58 min</span>
    <h1>Memory, Context, and <span style="white-space:nowrap">Long-Horizon</span> Execution</h1>
    <p class="chapter"><span class="live-dot"></span>Ch. 4 of 7 — Making Agents Stateful Over Time</p>
</div>

<div class="scrubber">
    <div class="track" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="3522" aria-valuenow="1394" tabindex="0">
        <div class="rail"></div>
        <div class="buffered"></div>
        <div class="fill"></div>
        <div class="tick" style="left:14%"></div>
        <div class="tick" style="left:29%"></div>
        <div class="tick" style="left:47%"></div>
        <div class="tick" style="left:63%"></div>
        <div class="tick" style="left:78%"></div>
        <div class="tick" style="left:91%"></div>
        <div class="thumb"></div>
    </div>
    <div class="times">
        <span class="elapsed">23:14</span>
        <span class="remaining">−35:28</span>
    </div>
</div>

<div class="transport">
    <button class="skip-btn" aria-label="Back 15 seconds">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M20 7 A 13 13 0 1 0 33 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            <path d="M20 2.5 L 14.5 7 L 20 11.5" fill="currentColor" stroke="none"/>
            <text x="20" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" font-family="inherit">15</text>
        </svg>
    </button>
    <button class="play-btn" aria-label="Play">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="currentColor"><path d="M8 5.5 L25 15 L8 24.5 Z"/></svg>
    </button>
    <button class="skip-btn" aria-label="Forward 30 seconds">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M20 7 A 13 13 0 1 1 7 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            <path d="M20 2.5 L 25.5 7 L 20 11.5" fill="currentColor" stroke="none"/>
            <text x="20" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" font-family="inherit">30</text>
        </svg>
    </button>
</div>

<nav class="secondary" aria-label="Playback options">
    <button class="speed" aria-label="Playback speed 1.0x">1.0×</button>
    <button aria-label="Sleep timer">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.2 A 7 7 0 1 1 7.8 3.5 A 5.6 5.6 0 0 0 16.5 12.2 Z"/></svg>
    </button>
    <button aria-label="Queue">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5.5 H17 M3 10 H17 M3 14.5 H10.5"/><path d="M14 12.2 L17.6 14.5 L14 16.8 Z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button aria-label="Bookmark this moment">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5.5 3.5 H14.5 V17 L10 13.6 L5.5 17 Z"/></svg>
    </button>
    <button aria-label="Transcript" class="is-active">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 5 H16 M4 8.7 H16 M4 12.4 H12 M4 16.1 H9"/></svg>
    </button>
</nav>

<script>
/* Monochrome editorial cover art. Grayscale tones only — the cold
   accent stays reserved for UI meaning. */
function art(type) {
    const S = 400;
    const line = 'oklch(0.92 0.003 225)';
    const dim  = 'oklch(0.42 0.006 225)';
    let bg = 'oklch(0.215 0.007 225)', body = '';
    if (type === 'rings') {
        bg = 'oklch(0.185 0.007 225)';
        let r = '';
        for (let i = 1; i <= 7; i++) {
            const rad = i * 34;
            const w = i === 4 ? 5 : 1.5;
            const c = i === 4 ? line : dim;
            r += `<circle cx="290" cy="130" r="${rad}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
        }
        body = r + `<circle cx="290" cy="130" r="7" fill="${line}"/>`;
    }
    return `<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg">
        <rect width="${S}" height="${S}" fill="${bg}"/>${body}
        <text x="28" y="368" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
              font-size="17" font-weight="700" letter-spacing="4" fill="${line}">AGENTIC CODING FRONTIER</text>
        <line x1="28" y1="340" x2="180" y2="340" stroke="${dim}" stroke-width="1.5"/>
    </svg>`;
}
document.querySelectorAll('[data-art]').forEach(el => { el.innerHTML = art(el.dataset.art); });
</script>
</body>
</html>
